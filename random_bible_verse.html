
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Bible Verse</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 600px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    h1 {
      color: #333;
    }
    #verse {
      margin-top: 20px;
      font-size: 1.3em;
      font-style: italic;
      color: #444;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #4facfe;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #00c6ff;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 Random Bible Verse</h1>
    <div id="verse">Loading verse...</div>
    <button onclick="fetchVerse()">Get Another Verse</button>
  </div>

  <script>
    async function fetchVerse() {
      const response = await fetch('https://labs.bible.org/api/?passage=random&type=text');
      const text = await response.text();
      document.getElementById('verse').innerText = text;
    }
    // Load verse on page load
    fetchVerse();
  </script>
</body>
</html>
